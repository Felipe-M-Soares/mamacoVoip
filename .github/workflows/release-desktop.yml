name: Build e publicar app desktop

# Roda sempre que algo é enviado pra main — o mesmo push que a Vercel
# usa pra atualizar o site também dispara isso aqui, então o app
# instalado no PC das pessoas recebe a atualização automaticamente na
# próxima vez que o electron-updater checar (ele checa toda vez que o
# app abre). Também pode ser disparado manualmente pela aba Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

# AUDITORIA: permissões mínimas por padrão — cada job pede só o que usa.
permissions:
  contents: read

# AUDITORIA: dois pushes seguidos na main disparavam dois fluxos em
# paralelo, disputando o mesmo "releases/latest". Agora eles entram em
# fila (o segundo espera o primeiro terminar, sem cancelar nenhum).
concurrency:
  group: release-desktop
  cancel-in-progress: false

jobs:
  # Cria e envia a tag da versão ANTES de qualquer build começar. Sem
  # isso, cada uma das 3 plataformas tentava criar o release já
  # "publicado" referenciando uma tag que ainda não existia de verdade
  # no repositório — o GitHub rejeita isso ("must have a valid tag").
  # Criando a tag aqui primeiro, ela já existe de verdade quando os
  # builds tentam publicar nela.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write # criar a tag e o release
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Calcular e criar a tag da versão
        id: version
        run: |
          VERSION="1.0.$(git rev-list --count HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      # AUDITORIA: o release agora nasce como RASCUNHO (--draft). Antes ele
      # já nascia publicado e virava o "releases/latest" na hora — mas
      # ainda SEM nenhum arquivo (os builds levam vários minutos). Todo app
      # aberto nesse intervalo recebia 404 no latest.yml (a causa real dos
      # 404 que o main.cjs tenta contornar com novas tentativas) e, pior,
      # o botão "Baixar" do site apontava pra um release vazio. O job
      # "publish" no final só publica depois que o instalador do Windows
      # e o latest.yml já estão lá.
      - name: Criar o release no GitHub como rascunho (antes dos builds, evita disputa entre as 3 plataformas)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ steps.version.outputs.version }}" --draft --title "v${{ steps.version.outputs.version }}" --generate-notes

  build:
    needs: prepare
    permissions:
      contents: write # enviar os instaladores pro release
    strategy:
      # AUDITORIA: sem isso, uma falha no build do macOS/Linux CANCELAVA
      # o do Windows no meio (e vice-versa) — a maior parte de quem usa o
      # app está no Windows e ficava sem atualização por causa das outras.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_flag: --win
          - os: macos-latest
            platform_flag: --mac
          - os: ubuntu-latest
            platform_flag: --linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # AUDITORIA: Node 20 chegou ao fim do suporte (abril/2026) e o Vite 8
      # exige 20.19+/22.12+ — 22 é LTS. `cache: npm` reaproveita o cache de
      # pacotes do npm entre execuções (a chave usa o package-lock.json, que
      # ainda existe neste ponto — só é apagado no passo seguinte).
      - name: Configurar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências (lock file completo, multiplataforma)
        shell: bash
        # O package-lock.json agora é gerado do zero e já traz os
        # binários nativos de TODAS as plataformas (rolldown,
        # lightningcss, tailwind oxide pra win32/darwin/linux) — o que
        # resolve o npm/cli#4828 sem precisar apagar o lock. Apagar o lock
        # fazia o npm resolver tudo do registro a cada build (versões
        # diferentes a cada release) e, desde set/2026, quebrava com
        # "Cannot read properties of null (reading 'edgesOut')" (bug do
        # npm 10 na resolução de peers). `npm ci` é reproduzível e rápido.
        run: npm ci --no-audit --no-fund

      - name: Definir a versão (mesma calculada no job "prepare")
        shell: bash
        run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version

      # Compila o .exe standalone de captura de áudio por processo
      # (native/process-audio-capture/capture.cpp — ver comentário no
      # topo desse arquivo pra entender o que ele faz e por quê é um
      # .exe separado em vez de um módulo nativo do Node). Só roda no
      # job do Windows: é código Win32/WASAPI puro, não existe
      # equivalente Mac/Linux, e o resto do app já lida bem com esse
      # .exe simplesmente não existir nessas plataformas (ver
      # electron/main.cjs — a captura por app fica indisponível, sem
      # quebrar mais nada). msvc-dev-cmd@v1 coloca o compilador cl.exe
      # (Visual Studio, já vem instalado no runner windows-latest) no
      # PATH — sem essa ação, "cl" não é reconhecido pelo shell.
      - name: Configurar compilador MSVC (só Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Compilar captura de áudio por processo (só Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          cl /nologo /utf-8 /EHsc /std:c++17 /O2 /DUNICODE /D_UNICODE native\process-audio-capture\capture.cpp /Fe:electron\process-audio-capture.exe /link ole32.lib mmdevapi.lib

      # VIGÉSIMA TERCEIRA RODADA — mesmo esquema do passo acima, pro
      # novo fallback de captura de tela via GDI puro (ver o comentário
      # grande no topo de native/screen-capture-gdi/capture.cpp pro
      # motivo completo: DXGI/WebRTC falhando com NotReadableError em
      # jogos de tela cheia com anti-cheat em placas AMD específicas,
      # mesmo com OBS funcionando na mesma máquina). gdiplus.lib
      # e gdi32.lib/user32.lib são as bibliotecas extras que esse
      # arquivo usa além de ole32.lib (já necessária pro passo acima).
      - name: Compilar fallback de captura de tela via GDI (só Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          cl /nologo /utf-8 /EHsc /std:c++17 /O2 /DUNICODE /D_UNICODE native\screen-capture-gdi\capture.cpp /Fe:electron\screen-capture-gdi.exe /link ole32.lib gdiplus.lib gdi32.lib user32.lib

      # TRIGÉSIMA TERCEIRA RODADA — mesmo esquema dos dois passos acima,
      # pro novo capturador via Windows Graphics Capture (ver o
      # comentário grande no topo de native/screen-capture-wgc/capture.cpp
      # pro motivo completo: é a única técnica que enxerga de verdade um
      # jogo em tela cheia EXCLUSIVA, sem depender de nenhum outro
      # programa aberto). windowsapp.lib é a biblioteca de projeção do
      # C++/WinRT (interoperação com a API moderna do Windows) — d3d11.lib
      # e dxgi.lib são as de Direct3D 11, usadas pra ler os quadros
      # capturados como pixels de verdade.
      - name: Compilar fallback de captura de tela via WGC (só Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          cl /nologo /utf-8 /EHsc /std:c++17 /O2 /DUNICODE /D_UNICODE native\screen-capture-wgc\capture.cpp /Fe:electron\screen-capture-wgc.exe /link ole32.lib gdiplus.lib gdi32.lib user32.lib d3d11.lib dxgi.lib windowsapp.lib

      - name: Build do app desktop (tsc + vite, caminhos relativos)
        run: npm run build:electron
        env:
          # Sem isso, o app abre com tela preta — o cliente do Supabase
          # trava o app inteiro se essas variáveis não existirem no
          # momento do build (o Vite "grava" elas dentro dos arquivos
          # gerados, não dá pra configurar depois). Use os MESMOS
          # valores que você já colocou nas Environment Variables da
          # Vercel. Configure em: Settings > Secrets and variables >
          # Actions > New repository secret, no seu repositório GitHub.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TURN_URL: ${{ secrets.VITE_TURN_URL }}
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}
          # Opcional — sem essa secret configurada, o GIF picker só fica
          # desativado (ver src/lib/config.ts), não quebra o build.
          VITE_GIPHY_API_KEY: ${{ secrets.VITE_GIPHY_API_KEY }}

      - name: Empacotar + publicar release (${{ matrix.os }})
        run: npx electron-builder ${{ matrix.platform_flag }} --publish always
        env:
          # Token automático do GitHub Actions — já tem permissão de
          # publicar releases neste mesmo repositório, não precisa
          # configurar nada extra.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Pacote para a Microsoft Store (MSIX/APPX) — o único jeito GRÁTIS de
      # acabar com o aviso "O Windows protegeu o computador" (SmartScreen):
      # a Microsoft assina o pacote depois de aprovar na Store. A
      # identidade (Package/Identity/Name, Publisher e nome de exibição do
      # editor) vem do Partner Center e está em package.json > build.appx.
      # O arquivo sai como artefato do workflow — você envia ele no
      # Partner Center. Não vai pro release (não é pra instalar direto).
      - name: Empacotar para a Microsoft Store (só Windows, opcional)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: npx electron-builder --win appx --x64 --publish never

      - name: Guardar pacote da Store como artefato
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: mamacos-voip-microsoft-store
          path: release/*.appx
          if-no-files-found: error

  # AUDITORIA: publica o rascunho criado em "prepare" — só depois que os
  # builds terminaram E o instalador do Windows + latest.yml (o manifesto
  # que o auto-updater lê) já estão anexados. Roda mesmo se o build de
  # macOS/Linux falhar (o Windows não fica refém dos outros), mas nunca
  # publica um release sem o latest.yml.
  publish:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publicar o release (sai de rascunho e vira o "latest")
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.prepare.outputs.version }}
        run: |
          ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "Arquivos no release $TAG:"
          echo "$ASSETS"
          if ! echo "$ASSETS" | grep -qx 'latest.yml'; then
            echo "::error::latest.yml não foi enviado (build do Windows falhou?) — o release $TAG fica como rascunho."
            exit 1
          fi
          if ! echo "$ASSETS" | grep -qx 'MamacosVoip-Setup.exe'; then
            echo "::error::MamacosVoip-Setup.exe não foi enviado — o release $TAG fica como rascunho."
            exit 1
          fi
          gh release edit "$TAG" --draft=false --latest
