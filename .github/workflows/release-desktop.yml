name: Build e publicar app desktop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-desktop
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write # criar a tag e o release
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Calcular e criar a tag da versão
        id: version
        run: |
          VERSION="1.0.$(git rev-list --count HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Criar o release no GitHub como rascunho (antes dos builds, evita disputa entre as 3 plataformas)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ steps.version.outputs.version }}" --draft --title "v${{ steps.version.outputs.version }}" --generate-notes

  build:
    needs: prepare
    permissions:
      contents: write # enviar os instaladores pro release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_flag: --win
          - os: macos-latest
            platform_flag: --mac
          - os: ubuntu-latest
            platform_flag: --linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências (lock file completo, multiplataforma)
        shell: bash
        run: npm ci --no-audit --no-fund

      - name: Definir a versão (mesma calculada no job "prepare")
        shell: bash
        run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Compilar os executáveis nativos (só Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          if not defined VSPATH (echo Visual Studio nao encontrado & exit /b 1)
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cl /nologo /utf-8 /EHsc /std:c++17 /O2 /DUNICODE /D_UNICODE native\process-audio-capture\capture.cpp /Fe:electron\process-audio-capture.exe /link ole32.lib mmdevapi.lib || exit /b 1
          cl /nologo /utf-8 /EHsc /std:c++17 /O2 /DUNICODE /D_UNICODE native\screen-capture-gdi\capture.cpp /Fe:electron\screen-capture-gdi.exe /link ole32.lib gdiplus.lib gdi32.lib user32.lib || exit /b 1
          cl /nologo /utf-8 /EHsc /std:c++17 /O2 /DUNICODE /D_UNICODE native\screen-capture-wgc\capture.cpp /Fe:electron\screen-capture-wgc.exe /link ole32.lib gdiplus.lib gdi32.lib user32.lib d3d11.lib dxgi.lib windowsapp.lib || exit /b 1

      - name: Build do app desktop (tsc + vite, caminhos relativos)
        run: npm run build:electron
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TURN_URL: ${{ secrets.VITE_TURN_URL }}
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}

      - name: Empacotar + publicar release (${{ matrix.os }})
        run: npx electron-builder ${{ matrix.platform_flag }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Empacotar para a Microsoft Store (só Windows, opcional)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: npx electron-builder --win appx --x64 --publish never

      - name: Guardar pacote da Store como artefato
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mamacos-voip-microsoft-store
          path: release/*.appx
          if-no-files-found: error

  android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # enviar o APK pro release
    steps:
      - name: Conferir a chave de assinatura
        id: cfg
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KP" ]; then
            echo "::warning::APK Android não gerado: faltam os secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD (ver docs/ANDROID.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Baixar o código
        if: steps.cfg.outputs.ok == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Configurar Node
        if: steps.cfg.outputs.ok == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java 21 (exigido pelo Capacitor 8)
        if: steps.cfg.outputs.ok == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Firebase (notificações)
        if: steps.cfg.outputs.ok == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            python3 -c "import json;json.load(open('android/app/google-services.json'))" || { echo "::error::GOOGLE_SERVICES_JSON não é um JSON válido"; exit 1; }
            echo "VITE_PUSH_ENABLED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Sem GOOGLE_SERVICES_JSON — APK sem notificações."
          fi

      - name: Build da interface + copiar pro projeto Android
        if: steps.cfg.outputs.ok == 'true'
        run: |
          npm ci --no-audit --no-fund
          npm run build:mobile
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TURN_URL: ${{ secrets.VITE_TURN_URL }}
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}

      - name: Gerar o APK assinado
        if: steps.cfg.outputs.ok == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          umask 077
          KS_FILE="$RUNNER_TEMP/mamacos-release.p12"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS_FILE"
          export ANDROID_KEYSTORE_FILE="$KS_FILE"
          export ANDROID_VERSION_CODE="${ANDROID_VERSION_NAME##*.}"
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cd ..
          rm -f "$KS_FILE"
          cp android/app/build/outputs/apk/release/app-release.apk MamacosVoip.apk
          ls -l MamacosVoip.apk

      - name: Enviar o APK pro release
        if: steps.cfg.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "v${{ needs.prepare.outputs.version }}" MamacosVoip.apk --clobber

  publish:
    needs: [prepare, build, android]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publicar o release (sai de rascunho e vira o "latest")
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.prepare.outputs.version }}
        run: |
          ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "Arquivos no release $TAG:"
          echo "$ASSETS"
          if ! echo "$ASSETS" | grep -qx 'latest.yml'; then
            echo "::error::latest.yml não foi enviado (build do Windows falhou?) — o release $TAG fica como rascunho."
            exit 1
          fi
          if ! echo "$ASSETS" | grep -qx 'MamacosVoip-Setup.exe'; then
            echo "::error::MamacosVoip-Setup.exe não foi enviado — o release $TAG fica como rascunho."
            exit 1
          fi
          gh release edit "$TAG" --draft=false --latest
