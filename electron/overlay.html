<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Mamacos Voip — Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }
    #panel {
      display: none;
      background: rgba(10, 10, 11, 0.85);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(224, 32, 27, 0.4);
      border-radius: 12px;
      padding: 10px 12px;
      max-width: 260px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    #channel-name {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: #a3a1a5;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .participant {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 3px 4px;
      border-radius: 6px;
      transition: box-shadow 0.15s;
    }
    .participant.speaking {
      box-shadow: 0 0 0 2px #e0201b;
    }
    .avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #e0201b;
      color: white;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .name {
      font-size: 12px;
      color: #f3efee;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .muted-icon {
      margin-left: auto;
      color: #ef4444;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div id="panel">
    <div id="channel-name">Não conectado</div>
    <div id="participants"></div>
  </div>

  <script>
    const panel = document.getElementById('panel')
    const channelNameEl = document.getElementById('channel-name')
    const participantsEl = document.getElementById('participants')

    function render(state) {
      if (!state || !state.connected) {
        panel.style.display = 'none'
        return
      }
      panel.style.display = 'block'
      channelNameEl.textContent = state.channelName || 'Conectado'
      participantsEl.innerHTML = ''
      for (const p of state.participants || []) {
        const row = document.createElement('div')
        row.className = 'participant' + (p.speaking ? ' speaking' : '')

        const avatar = document.createElement('div')
        avatar.className = 'avatar'
        if (p.avatarUrl) {
          const img = document.createElement('img')
          img.src = p.avatarUrl
          avatar.appendChild(img)
        } else {
          avatar.textContent = (p.name || '?').slice(0, 1).toUpperCase()
        }

        const name = document.createElement('div')
        name.className = 'name'
        name.textContent = p.name || '...'

        row.appendChild(avatar)
        row.appendChild(name)

        if (p.muted) {
          const muteIcon = document.createElement('span')
          muteIcon.className = 'muted-icon'
          muteIcon.textContent = '🔇'
          row.appendChild(muteIcon)
        }

        participantsEl.appendChild(row)
      }
    }

    if (window.overlayAPI) {
      window.overlayAPI.onVoiceState(render)
    }
  </script>
</body>
</html>
