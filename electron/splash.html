<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #09090a;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      .glow-bg {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 500px 350px at 50% 42%, rgba(224, 32, 27, 0.22), transparent 70%);
        pointer-events: none;
      }
      .logo-wrap {
        position: relative;
        width: 84px;
        height: 84px;
      }
      .logo-wrap img {
        width: 100%;
        height: 100%;
        border-radius: 999px;
        object-fit: cover;
        box-shadow: 0 0 32px 0 rgba(224, 32, 27, 0.55);
      }
      .ring {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        border: 2px solid rgba(224, 32, 27, 0.4);
        animation: ping 1.6s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      @keyframes ping {
        0% {
          transform: scale(1);
          opacity: 1;
        }
        75%,
        100% {
          transform: scale(1.7);
          opacity: 0;
        }
      }
      .spinner {
        width: 26px;
        height: 26px;
        border: 3px solid #e0201b;
        border-top-color: transparent;
        border-radius: 999px;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .label {
        color: #a39a9c;
        font-size: 13px;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div class="glow-bg"></div>
    <div class="logo-wrap">
      <img src="./splash-logo.png" alt="Mamacos Voip" />
      <div class="ring"></div>
    </div>
    <div class="spinner"></div>
    <div class="label">Abrindo o Mamacos Voip...</div>
  </body>
</html>
